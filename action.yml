name: 'Pac-Man Contributions'
description: 'Generate animated Pac-Man contributions graph SVG (dark + light)'
author: 'skp8500'

branding:
  icon: 'zap'
  color: 'yellow'

inputs:
  github_token:
    description: 'GitHub token'
    required: true

  github_username:
    description: 'Target GitHub username'
    required: false
    default: ''

runs:
  using: composite

  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        check-latest: true

    - name: Generate SVGs
      shell: bash
      run: node "${{ github.action_path }}/scripts/generate-pacman-svg.js"
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_USERNAME: ${{ inputs.github_username != '' && inputs.github_username || github.repository_owner }}

    - name: Push to output branch
      shell: bash
      run: |
        set -euo pipefail

        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        publish_dir="$(mktemp -d)"
        cleanup() {
          git worktree remove --force "$publish_dir" >/dev/null 2>&1 || rm -rf "$publish_dir"
        }
        trap cleanup EXIT

        git fetch origin output:refs/remotes/origin/output || true

        if git show-ref --verify --quiet refs/remotes/origin/output; then
          git worktree add --force "$publish_dir" refs/remotes/origin/output
        else
          git worktree add --detach "$publish_dir"
          (
            cd "$publish_dir"
            git checkout --orphan output
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          )
        fi

        rsync -a --delete dist/ "$publish_dir"/
        touch "$publish_dir/.nojekyll"

        cd "$publish_dir"
        git add pacman-dark.svg pacman-light.svg .nojekyll

        if git diff --cached --quiet; then
          echo "No SVG changes to publish"
          exit 0
        fi

        git commit -m "Generate Pac-Man contribution graph"
        git push origin HEAD:output
