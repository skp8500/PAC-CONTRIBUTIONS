name: 'Pac-Man Contributions'
description: 'Generate animated Pac-Man contributions graph SVG (dark + light)'
author: 'skp8500'
branding:
  icon: 'zap'
  color: 'yellow'

inputs:
  github_token:
    description: 'GitHub token with read:user scope'
    required: true
  github_username:
    description: 'Target GitHub username (defaults to the repo owner running the workflow)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate SVGs
      shell: bash
      run: node "${{ github.action_path }}/scripts/generate-pacman-svg.js"
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_USERNAME: ${{ inputs.github_username != '' && inputs.github_username || github.repository_owner }}
