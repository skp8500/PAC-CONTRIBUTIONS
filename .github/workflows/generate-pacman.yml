name: Generate Pac-Man SVG

on:
  schedule:
    # Runs daily at 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch:    # allow manual trigger from GitHub Actions tab
  push:
    branches: [main]
    paths:
      - 'scripts/generate-pacman-svg.js'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Pac-Man SVGs
        run: node scripts/generate-pacman-svg.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Commit SVGs to output branch
        run: |
          cd dist
          git init
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pacman-dark.svg pacman-light.svg
          git commit -m "chore: generate pac-man svgs [skip ci]"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:output
